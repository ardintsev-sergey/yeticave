[yeticave.local]

app_start_command = 
base_url          = https://{host_decoded}
bind_ip           = auto
environment       = System
http_engine       = Nginx
node_engine       = 
php_engine        = PHP-8.4
project_enabled   = on
project_root      = {base_dir}
server_aliases    = www yeticave.local
terminal_codepage = 65001
tls_cert_file     = auto
tls_enabled       = on
tls_key_file      = auto
web_root          = {base_dir}\
